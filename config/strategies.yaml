# ════════════════════════════════════════════════════════════════
# Strategy Definitions
# ════════════════════════════════════════════════════════════════

strategies:
  momentum:
    description: "Trend-following based on SMA crossovers and RSI momentum"
    indicators:
      - sma_20_50_cross
      - rsi_momentum
      - macd_signal
    min_confluence: 2
    preferred_timeframe: daily
    hold_period_days: 3-10

  mean_reversion:
    description: "Buy oversold, sell overbought using Bollinger Bands and RSI"
    indicators:
      - bb_pct_extreme
      - rsi_extreme
      - stoch_extreme
    min_confluence: 2
    preferred_timeframe: daily
    hold_period_days: 1-5

  breakout:
    description: "Volume-confirmed price breakouts above resistance"
    indicators:
      - price_above_bb_upper
      - volume_surge
      - macd_positive
    min_confluence: 3
    preferred_timeframe: daily
    hold_period_days: 2-7

  defensive:
    description: "Capital preservation during uncertain markets"
    indicators:
      - rsi_neutral
      - low_atr
      - price_near_sma200
    min_confluence: 2
    preferred_timeframe: daily
    hold_period_days: 5-15
    max_position_pct_override: 0.05  # 5% max position in defensive mode
